services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: syncboard
      POSTGRES_USER: syncboard
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - syncboard-data:/var/lib/postgresql/data
volumes:
  syncboard-data:
